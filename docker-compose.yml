services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: techcorp-devops-api:1.0.0
    container_name: techcorp_api_container
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
