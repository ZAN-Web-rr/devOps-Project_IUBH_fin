name: TechCorp DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # CONTINUOUS INTEGRATION (CI) STAGE
  # ============================================================
  continuous-integration:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest
    
    # Preconditions: Triggered by PR or push to main branch
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Automated Activity: Unit and Integration Testing
      - name: Run PyTest
        run: |
          pytest tests/ --doctest-modules --junitxml=junit/test-results.xml

      # Automated Activity: Static Application Security Testing (SAST)
      - name: Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================
  # CONTINUOUS DELIVERY (CD) STAGE
  # ============================================================
  continuous-delivery:
    name: Containerize and Publish
    runs-on: ubuntu-latest
    # Preconditions: CI Stage must pass completely
    needs: continuous-integration
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Simulated Registry Login (using GitHub Packages for reality)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Automated Activity: Build and Push Docker Image
      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/techcorp-api:${{ github.sha }},ghcr.io/${{ github.repository }}/techcorp-api:latest

  # ============================================================
  # CONTINUOUS DEPLOYMENT (CD) STAGE
  # ============================================================
  continuous-deployment-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    # Preconditions: CDel stage must complete successfully
    needs: continuous-delivery
    environment:
      name: staging
      url: https://staging.techcorp.local

    steps:
      - name: Deploy to Staging
        run: |
          echo "Pulling image ghcr.io/${{ github.repository }}/techcorp-api:${{ github.sha }}"
          echo "Simulating zero-downtime deployment to Staging Kubernetes Cluster..."
          echo "Deployment successful."

  continuous-deployment-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    # Preconditions: Staging deployment successful AND Human Approval required
    needs: continuous-deployment-staging
    environment:
      name: production
      url: https://api.techcorp.local
    
    # Human Decision Gate: GitHub Environments handles the approval pause here

    steps:
      - name: Deploy to Production
        run: |
          echo "Executing Production Deployment after Manual Approval..."
          echo "Pulling verified image ghcr.io/${{ github.repository }}/techcorp-api:${{ github.sha }}"
          echo "Deploying to Production Cluster..."
          echo "Deployment complete."
