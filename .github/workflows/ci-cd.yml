name: TechCorp FastAPI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/techcorp-api:${{ github.sha }}

jobs:
  continuous-integration:
    name: Test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p junit
          pytest -q tests/ \
            --junitxml=junit/test-results.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: |
            junit/test-results.xml
            coverage.xml
          if-no-files-found: ignore

      - name: Scan dependencies and source with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: continuous-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BUILD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

  deploy-staging:
    name: Deploy to Cloud Run staging
    runs-on: ubuntu-latest
    needs: publish-image
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy staging
        id: deploy
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}-staging
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --min 0 \
            --max 1 \
            --quiet
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Staging URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Generate staging identity token
        id: smoke-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Smoke-test staging
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/health"

  deploy-production:
    name: Deploy to Cloud Run production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PRODUCTION_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy production
        id: deploy
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --min 0 \
            --max 1 \
            --quiet
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Production URL: $SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Generate production identity token
        id: smoke-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PRODUCTION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Smoke-test production
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          curl --fail --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/health"
